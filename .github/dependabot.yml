version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/document-ia-api"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10

  - package-ecosystem: "uv"
    directory: "/document-ia-infra"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10

  - package-ecosystem: "uv"
    directory: "/document-ia-worker"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10

  - package-ecosystem: "uv"
    directory: "/document-ia-schemas"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10

  - package-ecosystem: "uv"
    directory: "/document-ia-evals"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10

  - package-ecosystem: "uv"
    directory: "/document-ia-auto-scaler"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
