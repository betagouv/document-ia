version: 2
updates:
  # One entry for the whole monorepo. Grouping is per-directory, so a single
  # dependency release would otherwise fan out into one grouped PR per package;
  # `group-by: dependency-name` collapses it into one PR across all packages.
  - package-ecosystem: "uv"
    directories: ["/document-ia-*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      uv-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
        group-by: dependency-name
      # Majors stay out of the minor/patch group so they get their own review,
      # but are still one PR per dependency rather than per package.
      uv-major:
        patterns: ["*"]
        update-types: ["major"]
        group-by: dependency-name
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
