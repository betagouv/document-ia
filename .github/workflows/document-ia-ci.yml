name: document-ia API CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
  merge_group:
  workflow_dispatch:

# Aucun droit par défaut : chaque job déclare ce dont il a besoin.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Ruff lint and Pytest (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            project: document-ia-api
            pythonpath: document-ia-api/src
            needs_docker_stack: true
            needs_tesseract: false
          - name: infra
            project: document-ia-infra
            pythonpath: document-ia-infra/src
            needs_docker_stack: true
            needs_tesseract: false
          - name: worker
            project: document-ia-worker
            pythonpath: document-ia-worker/src
            needs_docker_stack: true
            needs_tesseract: true
          - name: schemas
            project: document-ia-schemas
            pythonpath: document-ia-schemas/src
            needs_docker_stack: false
            needs_tesseract: false
          - name: evals
            project: document-ia-evals
            pythonpath: document-ia-evals/src
            needs_docker_stack: false
            needs_tesseract: false
          - name: auto-scaler
            project: document-ia-auto-scaler
            pythonpath: document-ia-auto-scaler/src
            needs_docker_stack: false
            needs_tesseract: false
    env:
      # Python path per project
      PYTHONPATH: ${{ matrix.pythonpath }}

      # API configuration
      API_KEY: your-secret-api-key-here

      # PostgreSQL
      POSTGRES_DB: document_ia_test
      POSTGRES_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your-secure-postgres-password
      POSTGRES_PORT: 5432

      WEBHOOK_SECRET_ENCRYPTION_KEY: ${{ secrets.WEBHOOK_SECRET_ENCRYPTION_KEY }}

      # Redis
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_PASSWORD: your-secure-redis-password

      # MinIO (S3 compatible)
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_PORT: 9000
      MINIO_CONSOLE_PORT: 9001

      # S3 settings
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_NAME: document-ia-test
      S3_REGION_NAME: us-east-1
      S3_USE_SSL: false

      DOCUMENT_IA_API_KEY: ${{ secrets.DOCUMENT_IA_API_KEY }}
      APP_ENV: dev

      # OpenAI / Albert
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

      # Tesseract
      TESSERACT_LANG: fra

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: "0.12.0"
          enable-cache: true

      # Install Tesseract OCR and French trained data
      - name: Install Tesseract OCR (with French language)
        if: ${{ matrix.needs_tesseract == true }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-fra
          tesseract --version
          tesseract --list-langs | grep -i '\bfra\b' || (echo "French language not found" && exit 1)

      - name: Install dependencies (matrix project)
        run: |
          cd ${{ matrix.project }}
          uv sync --locked

      - name: Ruff - Lint sources
        run: |
          cd ${{ matrix.project }}
          uv run ruff check src

      - name: Ruff - Check formatting
        run: |
          cd ${{ matrix.project }}
          uv run ruff format --check src

      - name: Start PostgreSQL
        if: ${{ matrix.needs_docker_stack == true }}
        run: |
          docker run -d \
            --name postgres-test \
            -e POSTGRES_DB=${POSTGRES_DB} \
            -e POSTGRES_USER=${POSTGRES_USER} \
            -e POSTGRES_PASSWORD=${POSTGRES_PASSWORD} \
            -p ${POSTGRES_PORT}:5432 \
            postgres:17-alpine

      - name: Start Redis
        if: ${{ matrix.needs_docker_stack == true }}
        run: |
          docker run -d \
            --name redis-test \
            -p ${REDIS_PORT}:6379 \
            redis:8-alpine

      - name: Start MinIO
        if: ${{ matrix.needs_docker_stack == true }}
        run: |
          docker run -d \
            --name minio-test \
            -e MINIO_ROOT_USER=${MINIO_ROOT_USER} \
            -e MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD} \
            -p ${MINIO_API_PORT}:9000 \
            -p ${MINIO_CONSOLE_PORT}:9001 \
            coollabsio/minio:latest server /data --console-address ":9001"

      - name: Wait for PostgreSQL to be ready
        if: ${{ matrix.needs_docker_stack == true }}
        run: |
          timeout 60s bash -c 'until docker exec postgres-test pg_isready -U ${POSTGRES_USER}; do sleep 1; done'
          echo "PostgreSQL is ready!"

      - name: Wait for Redis to be ready
        if: ${{ matrix.needs_docker_stack == true }}
        run: |
          timeout 60s bash -c 'until docker exec redis-test redis-cli ping | grep -q PONG; do sleep 1; done'
          echo "Redis is ready!"

      - name: Wait for MinIO to be ready
        if: ${{ matrix.needs_docker_stack == true }}
        run: |
          timeout 60s bash -c 'until curl -f http://localhost:${MINIO_API_PORT}/minio/health/live; do sleep 1; done'
          echo "MinIO is ready!"

      - name: Run migrations
        if: ${{ matrix.needs_docker_stack == true }}
        # We need to install deps of the API to run alembic migrations even on the worker
        run: |
          cd document-ia-api
          uv sync --locked
          uv run alembic upgrade head

      - name: Init S3 bucket
        if: ${{ matrix.needs_docker_stack == true }}
        run: |
          cd ${{ matrix.project }}
          # Le script est à la racine du repo; on remonte et on l'exécute dans le venv courant
          uv run python ../scripts/init-s3-bucket.py

      - name: Pytest - Tests (matrix project)
        run: |
          cd ${{ matrix.project }}
          uv run pytest --maxfail=1 --disable-warnings

      - name: Cleanup Docker containers
        if: ${{ always() && matrix.needs_docker_stack == true }}
        run: |
          docker stop postgres-test redis-test minio-test || true
          docker rm postgres-test redis-test minio-test || true

  gitleaks:
    name: Gitleaks (historique complet)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  osv-scan:
    name: OSV Scanner (dépendances)
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@e69cc6c86b31f1e7e23935bbe7031b50e51082de # v2.0.2
    with:
      scan-args: |-
        --lockfile=document-ia-api/uv.lock
        --lockfile=document-ia-infra/uv.lock
        --lockfile=document-ia-worker/uv.lock
        --lockfile=document-ia-schemas/uv.lock
        --lockfile=document-ia-evals/uv.lock
        --lockfile=document-ia-auto-scaler/uv.lock

  pyright:
    name: Pyright (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Non bloquant tant que les erreurs de typage existantes ne sont pas résolues
    # (baseline mesurée sur develop : api 9, infra 16, worker 9). Voir #124 point 6.
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            project: document-ia-api
          - name: infra
            project: document-ia-infra
          - name: worker
            project: document-ia-worker
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Install dependencies
        run: |
          cd ${{ matrix.project }}
          uv sync --locked

      - name: Pyright
        run: |
          cd ${{ matrix.project }}
          uv run pyright src
