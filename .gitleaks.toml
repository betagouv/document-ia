# .gitleaks.toml
title = "Configuration Gitleaks du projet"

# On indique à Gitleaks de conserver toutes ses excellentes règles par défaut !
[extend]
useDefault = true

# ---------------------------------------------------------
# 1. LISTE BLANCHE (Ce qu'on veut que Gitleaks ignore)
# ---------------------------------------------------------
[allowlist]
description = "Exclusions globales pour éviter les faux positifs"
paths = [
    # Environnements virtuels Python et dépendances
    '''^\.venv/.*$''',
    '''^node_modules/.*$''',

    # Dossiers de build (ex: Rust)
    '''^target/.*$''',

    # Fichiers de lock (génèrent énormément de faux positifs avec leurs hash)
    '''poetry\.lock$''',
    '''Cargo\.lock$''',
    '''package-lock\.json$''',

    # PDF de fixtures OCR : limité aux répertoires de fixtures de test, pas tous les PDF
    '''^[^/]+/tests/fixtures/.*\.pdf$''',

    # Snippet d'exemple evals : commande curl avec API_KEY_PLACEHOLDER littéral.
    '''document-ia-evals/src/document_ia_evals/assets/snippets/example\.sh$'''
]

# Ignorer des faux positifs récurrents directement dans le code
regexes = [
    '''gitleaks:allow''',
    '''example_token_for_tests''',
    # Clé factice d'exemple OpenAPI (schéma de réponse de l'endpoint admin api_key).
    # Valeur de documentation, jamais un secret réel ; présente dans l'historique.
    '''dia_dev_v1_ABCD1234_ABCDEFGHIJKLMNOPQRSTUVWX1234567890YZ12_IFZS''',
    # Clés factices des tests unitaires de l'API (fixtures, jamais des secrets réels).
    '''dia_dev_v1_TESTKEY1_ABCDEFGHIJKLMNOPQRSTUVWX1234567890YZ12_IFZS''',
    '''dia_dev_1_WMBUIIAK_WMBUIIAK2QQFKWQ5S7YPQZIUTFHQ2KKNFKPESOLLCQVME2NJFZUQ_BYMQ''',
    '''dia_dev_1_WMBUIIAK_WMBUIIAK2AAFKWQ5S7YPQZIUTFHQ2KKNFKPESOLLCQVME2NJFZUQ_BYMQ''',
    '''dia_dev_1_ID5RKLRX_ID5RKLRXQZM52XFUNGUHOBL7MAU3XQDRYN3R4HZH24DGGTFROBLA_5YTN''',
    # Placeholders des exemples curl de la documentation (README, docs).
    '''YOUR_API_KEY''',
    '''your-api-key-here'''
]

# ---------------------------------------------------------
# 2. RÈGLES PERSONNALISÉES (Ce qu'on veut ajouter)
# ---------------------------------------------------------

[[rules]]
id = "document-ia-token"
description = "Détection des tokens d'environnement DocumentIA (dia_...)"
# On cherche 'dia_' suivi de lettres, chiffres et underscores (entre 40 et 100 caractères pour éviter les faux positifs courts)
regex = '''dia_[a-zA-Z0-9_]{40,100}'''
