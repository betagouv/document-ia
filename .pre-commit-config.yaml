# Installe les hooks aux étapes pre-commit et pre-push :
# - pre-commit : gitleaks scanne les modifications stagées (diff de l'index) ;
# - pre-push : scripts/gitleaks_pre_push.sh scanne les commits sortants
#   (au push, l'index est vide, un scan --staged ne détecterait rien).
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
        args: [ --fix ]
        files: ^(document-ia-api|document-ia-infra|document-ia-worker|document-ia-schemas|document-ia-evals|document-ia-auto-scaler)/src/.*.py$
      - id: ruff-format
        files: ^(document-ia-api|document-ia-infra|document-ia-worker|document-ia-schemas|document-ia-evals|document-ia-auto-scaler)/src/.*.py$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files
        exclude: ^document-ia-api/src/static/
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: ["--config", ".gitleaks.toml"]
        stages: [pre-commit]

  # Scan gitleaks des commits sortants au push : l'index est vide à ce stade,
  # le hook pre-commit (--staged) ne détecterait rien.
  - repo: local
    hooks:
      - id: gitleaks-pre-push
        name: gitleaks pre-push (commits sortants)
        language: system
        entry: bash scripts/gitleaks_pre_push.sh
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  # Un seul lockfile à la racine du monorepo (workspace uv). Il n'y a donc plus
  # un hook par sous-projet : toute modification d'un pyproject.toml relocke l'ensemble.
  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock (workspace)
        language: system
        pass_filenames: false
        files: (^|/)pyproject\.toml$
        entry: uv lock
