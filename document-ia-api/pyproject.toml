[project]
name = "document-ia-api"
version = "1.0.11"
description = "API minimaliste FastAPI avec authentification API_KEY"
authors = [{name = "Romaric HALDENWANG",email = "romaric.haldenwang@beta.gouv.fr"}, {name = "Nicolas Sagon",email = "nicolas.sagon@beta.gouv.fr"}]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi == 0.136.3",
    "pydantic == 2.14.1",
    "starlette == 1.10.0",
    "python-dotenv == 1.2.2",
    "pydantic-settings == 2.14.1",
    "sqlalchemy == 2.0.50",
    "uvicorn == 0.54.0",
    "gunicorn == 22.0.0",
    "python-magic == 0.4.27",
    "python-multipart == 0.0.32",
    "asyncpg == 0.32.0",
    "greenlet == 3.5.6",
    "alembic == 1.20.1",
    "psycopg2-binary == 2.9.12",
    "document-ia-infra",
    "document-ia-schemas",
    "python-logging-loki == 0.3.1",
    "argon2-cffi == 25.1.0",
    "cryptography == 50.0.2",
    "httpx == 0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff == 0.12.12",
    "pytest == 9.2.0",
    "pytest-asyncio == 1.4.1",
    "pre-commit == 3.8.0",
    "httpx == 0.28.1",
    "pyright == 1.1.414",
    "boto3-stubs == 1.43.16",
]

[tool.uv]
required-version = ">=0.12.0"
exclude-newer = "1 week"
# Security: virtualenv >= 21.14.13 fixes GHSA-cx6f-vjhg-g3cc and supports filelock >= 4.2.1.

[tool.uv.sources.document-ia-infra]
path = "../document-ia-infra"
editable = true

[tool.uv.sources.document-ia-schemas]
path = "../document-ia-schemas"
editable = true

[tool.hatch.build.targets.wheel]
packages = ["src/document_ia_api"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
