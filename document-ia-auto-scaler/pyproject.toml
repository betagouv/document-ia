[project]
name = "document-ia-auto-scaler"
version = "1.0.0"
description = "Auto-scaler daemon for Scalingo workers based on queue lag"
authors = [{name = "Nicolas Sagon",email = "nicolas.sagon@beta.gouv.fr"}]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "document-ia-infra",
    "python-dotenv == 1.2.2",
    "pydantic-settings == 2.14.1",
    "pydantic == 2.13.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff == 0.12.12",
    "pytest == 8.4.2",
    "pytest-asyncio == 0.23.8",
    "pre-commit == 3.8.0",
]

[tool.uv]
exclude-newer = "2 days"

[tool.uv.sources.document-ia-infra]
path = "../document-ia-infra"
editable = true

[tool.hatch.build.targets.wheel]
packages = ["src/document_ia_auto_scaler"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
