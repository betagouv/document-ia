[project]
name = "document-ia-evals"
version = "1.0.11"
description = ""
authors = [
    {name = "Erwan BOEHM",email = "erwan.boehm@gmail.com"},
    {name = "Olivier DULCY",email = "olivier.dulcy@beta.gouv.fr"},
    {name = "Nicolas Sagon",email = "nicolas.sagon@beta.gouv.fr"}
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "streamlit == 1.66.1",
    "pandas == 3.1.0",
    "plotly == 7.1.0",
    "python-dotenv == 1.2.4",
    "label-studio-sdk==2.1.3",
    "requests == 2.34.2",
    "urllib3 == 2.8.0",
    "boto3 == 1.43.121",
    "deepdiff == 9.1.0",
    "sqlalchemy == 2.1.6",
    "alembic == 1.20.1",
    "pydantic == 2.14.1",
    "pydantic-settings == 2.16.2",
    "psycopg2-binary == 2.9.13",
    "document-ia-schemas",
    "document-ia-infra",
    "document-ia-api",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff == 0.17.3",
    "pytest == 9.2.0",
]

[tool.uv]
required-version = ">=0.12.0"
exclude-newer = "1 week"

[tool.uv.sources.document-ia-schemas]
path = "../document-ia-schemas"
editable = true

[tool.uv.sources.document-ia-infra]
path = "../document-ia-infra"
editable = true

[tool.uv.sources.document-ia-api]
path = "../document-ia-api"
editable = true

[tool.hatch.build.targets.wheel]
packages = ["src/document_ia_evals"]

[tool.ruff]
target-version = "py313"
line-length = 88

# TODO: Dans une PR complémentaire, durcir le linter et revenir aux règles par défaut de Ruff
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
