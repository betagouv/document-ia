[project]
name = "document-ia-infra"
version = "1.0.8"
description = "Code des briques d'infrastructure pour Document IA"
authors = [{name = "Nicolas Sagon",email = "nicolas.sagon@beta.gouv.fr"}]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv == 1.2.2",
    "redis == 5.3.1",
    "boto3 == 1.35.99",
    "pydantic == 2.13.4",
    "openai == 1.109.1",
    "tiktoken == 0.11.0",
    "sqlalchemy == 2.0.50",
    "asyncpg == 0.30.0",
    "mypy-boto3-s3 == 1.43.14",
    "python-logging-loki == 0.3.1",
    "document-ia-schemas",
    "cryptography == 43.0.3",
    "psycopg2-binary == 2.9.12",
    "pyyaml == 6.0.3",
    "greenlet == 3.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff == 0.12.12",
    "pytest == 8.4.2",
    "pytest-asyncio == 0.23.8",
    "pydantic-settings == 2.14.1",
    "pre-commit == 3.8.0",
    "pyright == 1.1.409",
]

[tool.uv]
exclude-newer = "2 days"

[tool.uv.sources.document-ia-schemas]
path = "../document-ia-schemas"
editable = true

[tool.hatch.build.targets.wheel]
packages = ["src/document_ia_infra"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
