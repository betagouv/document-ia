[project]
name = "document-ia-schemas"
version = "1.0.11"
description = "Projet pour stocker les schémas de documents de Document IA"
authors = [{name = "Nicolas Sagon",email = "nicolas.sagon@beta.gouv.fr"}]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic==2.14.2",
]

[project.license]
text = "MIT"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff == 0.17.3",
    "pytest == 9.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/document_ia_schemas"]

[tool.ruff]
target-version = "py313"
line-length = 88

# TODO: Dans une PR complémentaire, durcir le linter et revenir aux règles par défaut de Ruff
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.uv]
required-version = ">=0.12.0"
exclude-newer = "1 week"
