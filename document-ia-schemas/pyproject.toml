[project]
name = "document-ia-schemas"
version = "1.0.8"
description = "Projet pour stocker les schémas de documents de Document IA"
authors = [{name = "Nicolas Sagon",email = "nicolas.sagon@beta.gouv.fr"}]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic == 2.13.4",
]

[project.license]
text = "MIT"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff == 0.12.12",
    "pytest == 8.4.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/document_ia_schemas"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.uv]
exclude-newer = "2 days"
