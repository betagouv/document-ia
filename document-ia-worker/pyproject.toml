[project]
name = "document-ia-worker"
version = "1.0.11"
description = "Worker document ia"
authors = [{name = "Nicolas Sagon",email = "nicolas.sagon@beta.gouv.fr"}]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "document-ia-infra",
    "document-ia-schemas",
    "python-dotenv == 1.2.4",
    "pydantic-settings == 2.16.2",
    "pytesseract == 0.3.13",
    "pymupdf == 2.0",
    "opencv-python-headless == 5.0.0.93",
    "jinja2 == 3.1.6",
    "pydantic == 2.14.1",
    "mypy-boto3-s3 == 1.43.106",
    "greenlet == 3.5.6",
    "httpx == 0.28.1",
    "zxing-cpp == 3.1.1",
    "2ddoc-parser",
    "python-magic == 0.4.27",
    "psycopg2-binary == 2.9.13",
    "torch == 2.7.1+cpu; sys_platform == 'linux'",
    "torch == 2.7.1; sys_platform == 'darwin'",
    "torchvision == 0.22.1+cpu; sys_platform == 'linux'",
    "torchvision == 0.22.1; sys_platform == 'darwin'",
    "qrdet == 2.5",
    "pyright == 1.1.414",
    "clip",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff == 0.17.3",
    "pytest == 9.2.0",
    "pytest-asyncio == 1.4.1",
    "pre-commit == 4.7.0",
    "uvicorn == 0.54.0",
]

[tool.uv]
required-version = ">=0.12.0"
exclude-newer = "1 week"
# Security: virtualenv >= 21.14.13 fixes GHSA-cx6f-vjhg-g3cc and supports filelock >= 4.2.1.

[tool.uv.sources]
clip = { git = "https://github.com/ultralytics/CLIP.git" }

[tool.uv.sources.document-ia-infra]
path = "../document-ia-infra"
editable = true

[tool.uv.sources.document-ia-schemas]
path = "../document-ia-schemas"
editable = true

[tool.uv.sources.2ddoc-parser]
git = "https://github.com/betagouv/2ddoc-parser.git"
tag = "v1.0.6"

[[tool.uv.sources.torch]]
index = "pytorch-cpu"
marker = "sys_platform == 'linux'"

[[tool.uv.sources.torchvision]]
index = "pytorch-cpu"
marker = "sys_platform == 'linux'"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/document_ia_worker", "src/document_ia_task_scheduler"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
